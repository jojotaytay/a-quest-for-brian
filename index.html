<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Very Important Quest for Brian Matthew</title><link rel="stylesheet" href="style.css"></head>
<body><div id="progress"><span id="bar"></span></div><main id="app"></main>
<script>
const pages=[
`<div class="eyebrow">TOP SECRET • FOR ONE BRIAN MATTHEW ONLY</div><h1 class="big">A Very Important Quest</h1><p class="lead">Brian Matthew, you have been selected for a highly important mission.<br><br>There is something waiting for you at the end.<br>Unfortunately, I have decided you must work for it.</p><button onclick="show(1)">BEGIN →</button><p class="tiny">Estimated difficulty: concerning. Estimated torso length: short.</p>`,
`<div class="chapter">Prologue</div><h2 class="big">Once upon a time…</h2><p class="lead">There was a boy named Brian. He loved God, Macbeth, How to Train Your Dragon, music, and—somewhat alarmingly—identifying Honda Civics from great distances.</p><p class="lead">Then, through church, university, youth ministry, and a truly unreasonable number of hour-long commutes… he became friends with a girl named Joey.</p><button onclick="show(2)">this sounds suspicious →</button>`,
`<div class="chapter">Chapter I</div><h2 class="big">The Commute Era</h2><p class="quote">Somehow, an hour travelling home never felt like an hour when I was talking to you.</p><p class="lead">We were friends first. We served together. We talked and talked and talked. And somewhere in all that ordinary time, you became very important to me.</p><button onclick="show(3)">continue the investigation →</button>`,
`<div class="chapter">Chapter II</div><h2 class="big">The Fiji Incident</h2><img class="photo" src="plane.jpg"><p class="lead">One night in Fiji, Joey was stuck on a bus. Joey was thirsty. There was no water left.</p><p class="lead"><b>Mission parameters:</b> impossible.</p><p class="lead">And then suddenly there was a water bottle in my hand, because you had literally climbed over people to get one to me.</p><p class="quote">I still think about that.</p><button onclick="show(4)">water acquired ✓ →</button>`,
`<div class="chapter">Chapter III</div><h2 class="big">Brian Identification Test</h2><p class="lead">A yellow Honda Civic has been spotted. What is the correct response?</p><button onclick="alert('Ignore it? Are you Brian Matthew at all?')">Ignore it</button><button onclick="alert('Respectfully, no.')">Say “nice car”</button><button onclick="show(5)">POINT IT OUT + PUNCH JOEY</button><br><img class="photo" src="yellow-civic.jpg">`,
`<div class="chapter">Chapter IV</div><h2 class="big">The Archives</h2><div class="polaroids"><figure style="--r:-2deg"><img src="creme-1.jpg"><figcaption>making things together ♡</figcaption></figure><figure style="--r:2deg"><img src="creme-2.jpg"><figcaption>brimmy + joey</figcaption></figure><figure style="--r:-1deg"><img src="beach.jpg"><figcaption>adventures with you</figcaption></figure><figure style="--r:2deg"><img src="sunset.jpg"><figcaption>Fiji, us, and a very good sky</figcaption></figure></div><button onclick="show(6)">there is more →</button>`,
`<div class="chapter">Chapter V</div><h2 class="big">A Familiar Challenge</h2><p class="lead">Brian felt a strange sense of déjà vu. Somewhere, a Codex Wheel turned. Somewhere else, Macbeth stared intensely at a dagger.</p><div class="cipher">GPSUJTTJTJNP</div><p class="lead">Caesar has moved every letter forward by one. Move them back.</p><input id="answer" class="input" placeholder="your answer"><br><button onclick="cipher()">SUBMIT</button><p id="hint" class="tiny">Hint: it is something we are looking forward to.</p>`,
`<div class="chapter">Chapter VI</div><h2 class="big">Choose Wisely.</h2><p class="lead">Joey has had A Day™. Brian encounters her. What does he do?</p><button onclick="show(8)">give hug</button><button onclick="show(8)">bring food</button><button onclick="show(8)">listen to the entire rant</button><button onclick="bad()">run away</button>`,
`<div class="chapter">Chapter VII</div><h2 class="big">Meadows</h2><img class="photo" src="shadows.jpg"><p class="lead">I loved lying on the grass at Gardens by the Bay and just talking with you. I love that some of my favourite moments with you aren't complicated at all.</p><p class="quote">It's just us, somewhere, with time to talk.</p><button onclick="show(9)">keep going →</button>`,
`<div class="chapter">Chapter VIII</div><h2 class="big">Things I Keep</h2><p class="love-line">I love how incredibly loving you are to me.</p><p class="love-line">I love your heart for God.</p><p class="love-line">I love that we don't only get to be together — we get to serve together.</p><p class="love-line">I love listening to you make music out of nothing.</p><p class="love-line">I love the big adventures and the hour-long commutes.</p><p class="love-line">I love doing life with you, Brimmy.</p><button onclick="show(10)">one last thing →</button>`,
`<div class="eyebrow">FINAL CHAPTER</div><h2 class="big">There was never really a quest.</h2><p class="lead">You didn't actually need to solve anything.</p><p class="lead">I just wanted to take you through these little pieces of us, because somewhere between serving together, long commutes, Fiji, music shops, meadows, yellow cars, and everything else…</p><p class="quote">you became one of my favourite parts of my story.</p><p class="lead">And there is really only one thing I made this whole website to tell you.</p><button onclick="finale()">tell me</button>`
];
function show(n){document.body.classList.remove('final');document.getElementById('app').innerHTML='<section class="screen"><div class="card">'+pages[n]+'</div></section>';document.getElementById('bar').style.width=(n/11*100)+'%';scrollTo(0,0)}
function cipher(){const a=document.getElementById('answer').value.toLowerCase().replace(/[^a-z]/g,'');if(a==='fortississimo')show(7);else document.getElementById('hint').textContent='Not quite. Shift each letter BACK one. GPSUJTTJTJNP → ?'}
function bad(){document.getElementById('app').innerHTML='<section class="screen"><div class="card bad"><div class="eyebrow">BAD ENDING</div><h2 class="big">Brian was never seen again.</h2><p class="lead">An avoidable tragedy.</p><button onclick="show(7)">perhaps reconsider</button></div></section>'}
function finale(){document.body.classList.add('final');document.getElementById('bar').style.width='100%';document.getElementById('app').innerHTML='<section class="screen"><div class="card"><div class="heart">♥</div><div class="eyebrow">FOR BRIAN MATTHEW, FROM JOEY</div><h1 class="big">I love you,<br>Brian Matthew.</h1><p class="lead">Very, very much.<br><br>Thank you for being my Brimmy.</p><div class="polaroids"><figure style="--r:-2deg"><img src="creme-2.jpg"><figcaption>us ♡</figcaption></figure><figure style="--r:2deg"><img src="sunset.jpg"><figcaption>and many more adventures to come</figcaption></figure></div><p class="tiny">P.S. your torso is still short.</p></div></section>';confetti()}
function confetti(){for(let i=0;i<50;i++)setTimeout(()=>{const x=document.createElement('div');x.className='confetti';x.textContent=['♥','✦','♡','♪'][Math.floor(Math.random()*4)];x.style.left=Math.random()*100+'vw';document.body.appendChild(x);setTimeout(()=>x.remove(),4000)},i*40)}
show(0);
</script></body></html>
